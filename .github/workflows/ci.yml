name: Browser Bridge CI
on:
  push:
  pull_request:
  workflow_dispatch:

# Keep only the newest build for each branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install
      - run: npm run check
      - run: npm run build:chrome
      - run: npm run build:firefox
      - run: npm run build:firefox:android
      - name: Package Chrome extension as CRX3
        shell: bash
        run: |
          mkdir -p release-assets
          npx --yes crx3@2.0.0 --keyPath "$RUNNER_TEMP/vortex-browser-bridge-chrome.pem" --crxPath "$GITHUB_WORKSPACE/release-assets/vortex-browser-bridge-chrome.crx" .output/chrome-mv3
          test -s release-assets/vortex-browser-bridge-chrome.crx
      - name: Package Firefox desktop extension as XPI
        shell: bash
        run: |
          (cd .output/firefox-mv3 && zip -qr "$GITHUB_WORKSPACE/release-assets/vortex-browser-bridge-firefox.xpi" . -x '*.map')
          test -s release-assets/vortex-browser-bridge-firefox.xpi
      - name: Package Firefox for Android extension as XPI
        shell: bash
        run: |
          (cd .output/firefox-mv2 && zip -qr "$GITHUB_WORKSPACE/release-assets/vortex-browser-bridge-firefox-android.xpi" . -x '*.map')
          test -s release-assets/vortex-browser-bridge-firefox-android.xpi
      - name: Upload Chrome CRX
        uses: actions/upload-artifact@v4
        with:
          name: vortex-browser-bridge-chrome-crx
          if-no-files-found: error
          retention-days: 30
          path: release-assets/vortex-browser-bridge-chrome.crx
      - name: Upload Firefox desktop XPI
        uses: actions/upload-artifact@v4
        with:
          name: vortex-browser-bridge-firefox-xpi
          if-no-files-found: error
          retention-days: 30
          path: release-assets/vortex-browser-bridge-firefox.xpi
      - name: Upload Firefox Android XPI
        uses: actions/upload-artifact@v4
        with:
          name: vortex-browser-bridge-firefox-android-xpi
          if-no-files-found: error
          retention-days: 30
          path: release-assets/vortex-browser-bridge-firefox-android.xpi
  protocol-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: browser-bridge
      - uses: actions/checkout@v4
        with:
          repository: jue-wq/VortexDM
          path: VortexDM
      - run: diff -u VortexDM/docs/IPC_PROTOCOL.md browser-bridge/docs/IPC_PROTOCOL.md
