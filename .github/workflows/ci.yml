name: Browser Bridge CI
on:
  push:
  pull_request:
  workflow_dispatch:

# Keep only the newest build for each branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run build:chrome
      - run: npm run build:firefox
      - run: npm run build:firefox:android
      - name: Package Chrome extension as CRX3
        shell: bash
        env:
          CHROME_EXTENSION_PRIVATE_KEY: ${{ secrets.CHROME_EXTENSION_PRIVATE_KEY }}
        run: |
          mkdir -p release-assets
          if [ -n "${CHROME_EXTENSION_PRIVATE_KEY:-}" ]; then
            printf '%s\n' "$CHROME_EXTENSION_PRIVATE_KEY" > "$RUNNER_TEMP/vortex-browser-bridge-chrome.pem"
          fi
          npx --yes crx3@2.0.0 --keyPath "$RUNNER_TEMP/vortex-browser-bridge-chrome.pem" --crxPath "$GITHUB_WORKSPACE/release-assets/vortex-browser-bridge-chrome.crx" .output/chrome-mv3
          test -s release-assets/vortex-browser-bridge-chrome.crx
      - name: Package Firefox desktop extension
        id: firefox-desktop-package
        shell: bash
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -n "${AMO_JWT_ISSUER:-}" ] && [ -n "${AMO_JWT_SECRET:-}" ]; then
            npx --yes web-ext@8 sign --source-dir .output/firefox-mv3 --artifacts-dir release-assets/firefox-signed --channel unlisted --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
            cp release-assets/firefox-signed/*.xpi release-assets/vortex-browser-bridge-firefox.xpi
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            (cd .output/firefox-mv3 && zip -qr "$GITHUB_WORKSPACE/release-assets/vortex-browser-bridge-firefox-unsigned.zip" . -x '*.map')
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Package Firefox for Android extension
        id: firefox-android-package
        shell: bash
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -n "${AMO_JWT_ISSUER:-}" ] && [ -n "${AMO_JWT_SECRET:-}" ]; then
            npx --yes web-ext@8 sign --source-dir .output/firefox-mv2 --artifacts-dir release-assets/firefox-android-signed --channel unlisted --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
            cp release-assets/firefox-android-signed/*.xpi release-assets/vortex-browser-bridge-firefox-android.xpi
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            (cd .output/firefox-mv2 && zip -qr "$GITHUB_WORKSPACE/release-assets/vortex-browser-bridge-firefox-android-unsigned.zip" . -x '*.map')
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate standalone extension packages
        shell: bash
        run: |
          test "$(head -c 4 release-assets/vortex-browser-bridge-chrome.crx)" = "Cr24"
          for package in release-assets/vortex-browser-bridge-firefox.xpi release-assets/vortex-browser-bridge-firefox-unsigned.zip release-assets/vortex-browser-bridge-firefox-android.xpi release-assets/vortex-browser-bridge-firefox-android-unsigned.zip; do
            if [ -f "$package" ]; then unzip -t "$package"; fi
          done
      - name: Upload Chrome CRX
        uses: actions/upload-artifact@v6
        with:
          name: vortex-browser-bridge-chrome-crx
          if-no-files-found: error
          retention-days: 30
          path: release-assets/vortex-browser-bridge-chrome.crx
      - name: Upload signed Firefox desktop XPI
        if: steps.firefox-desktop-package.outputs.signed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: vortex-browser-bridge-firefox-xpi
          if-no-files-found: error
          retention-days: 30
          path: release-assets/vortex-browser-bridge-firefox.xpi
      - name: Upload unsigned Firefox desktop package
        if: steps.firefox-desktop-package.outputs.signed != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: vortex-browser-bridge-firefox-unsigned-zip
          if-no-files-found: error
          retention-days: 30
          path: release-assets/vortex-browser-bridge-firefox-unsigned.zip
      - name: Upload signed Firefox Android XPI
        if: steps.firefox-android-package.outputs.signed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: vortex-browser-bridge-firefox-android-xpi
          if-no-files-found: error
          retention-days: 30
          path: release-assets/vortex-browser-bridge-firefox-android.xpi
      - name: Upload unsigned Firefox Android package
        if: steps.firefox-android-package.outputs.signed != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: vortex-browser-bridge-firefox-android-unsigned-zip
          if-no-files-found: error
          retention-days: 30
          path: release-assets/vortex-browser-bridge-firefox-android-unsigned.zip
  protocol-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          path: browser-bridge
      - uses: actions/checkout@v5
        with:
          repository: jue-wq/VortexDM
          path: VortexDM
      - run: diff -u VortexDM/docs/IPC_PROTOCOL.md browser-bridge/docs/IPC_PROTOCOL.md
  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: [verify, protocol-sync]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download individual extension packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p release-assets/chrome downloaded
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir downloaded
          CRX="$(find downloaded -type f -name '*.crx' -print -quit)"
          [ -n "$CRX" ] && cp "$CRX" release-assets/chrome/vortex-browser-bridge-chrome.crx
          for package in vortex-browser-bridge-firefox.xpi vortex-browser-bridge-firefox-unsigned.zip vortex-browser-bridge-firefox-android.xpi vortex-browser-bridge-firefox-android-unsigned.zip; do
            source="$(find downloaded -type f -name "$package" -print -quit)"
            [ -z "$source" ] || cp "$source" "release-assets/$package"
          done
          test -s release-assets/chrome/vortex-browser-bridge-chrome.crx
      - name: Publish individual extension files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            TITLE="$GITHUB_REF_NAME"
            PRERELEASE=()
          else
            TAG="nightly"
            TITLE="Vortex Browser Bridge Nightly"
            PRERELEASE=(--prerelease)
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --target main --generate-notes "${PRERELEASE[@]}"
          fi
          ASSETS=(release-assets/chrome/vortex-browser-bridge-chrome.crx)
          [ ! -f release-assets/vortex-browser-bridge-firefox.xpi ] || ASSETS+=(release-assets/vortex-browser-bridge-firefox.xpi)
          [ ! -f release-assets/vortex-browser-bridge-firefox-unsigned.zip ] || ASSETS+=(release-assets/vortex-browser-bridge-firefox-unsigned.zip)
          [ ! -f release-assets/vortex-browser-bridge-firefox-android.xpi ] || ASSETS+=(release-assets/vortex-browser-bridge-firefox-android.xpi)
          [ ! -f release-assets/vortex-browser-bridge-firefox-android-unsigned.zip ] || ASSETS+=(release-assets/vortex-browser-bridge-firefox-android-unsigned.zip)
          if [ ! -f release-assets/vortex-browser-bridge-firefox.xpi ]; then
            gh release delete-asset "$TAG" vortex-browser-bridge-firefox.xpi --repo "$GITHUB_REPOSITORY" --yes || true
          fi
          if [ ! -f release-assets/vortex-browser-bridge-firefox-android.xpi ]; then
            gh release delete-asset "$TAG" vortex-browser-bridge-firefox-android.xpi --repo "$GITHUB_REPOSITORY" --yes || true
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "${ASSETS[@]}" --clobber
