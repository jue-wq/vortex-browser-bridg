name: Browser Bridge CI
on:
  push:
  pull_request:
  workflow_dispatch:

# Keep only the newest build for each branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install
      - run: npm run check
      - run: npm run build:chrome
      - run: npm run build:firefox
      - run: npm run build:firefox:android
      - name: Upload browser extension packages
        uses: actions/upload-artifact@v4
        with:
          name: vortex-browser-bridge-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            .output/chrome-mv3/**
            .output/firefox-mv3/**
            .output/firefox-mv2/**
  protocol-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: browser-bridge
      - uses: actions/checkout@v4
        with:
          repository: jue-wq/VortexDM
          path: VortexDM
      - run: diff -u VortexDM/docs/IPC_PROTOCOL.md browser-bridge/docs/IPC_PROTOCOL.md
