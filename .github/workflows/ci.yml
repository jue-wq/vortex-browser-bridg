name: Vortex Browser Bridge

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Prepare lockfile and install dependencies
        run: |
          npm install --install-strategy=nested --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npm ci --install-strategy=nested --legacy-peer-deps --no-audit --no-fund
      - name: Typecheck and tests
        run: npm run check
      - name: Build Chrome MV3
        run: npm run build:chrome
      - name: Build Firefox Desktop
        run: npm run build:firefox
      - name: Build Firefox for Android
        run: npm run build:firefox:android
      - name: Package and verify browser archives
        run: bash scripts/package-extensions.sh
      - uses: actions/upload-artifact@v6
        with:
          name: vortex-browser-bridge-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  protocol-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          path: browser-bridge
      - uses: actions/checkout@v5
        continue-on-error: true
        with:
          repository: jue-wq/VortexDM
          path: VortexDM
      - name: Compare shared protocol (non-blocking)
        continue-on-error: true
        run: |
          if [[ ! -f VortexDM/docs/IPC_PROTOCOL.md ]]; then
            echo "::warning::VortexDM protocol document is unavailable; sync check skipped."
            exit 0
          fi
          diff -u VortexDM/docs/IPC_PROTOCOL.md browser-bridge/docs/IPC_PROTOCOL.md

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build-and-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: vortex-browser-bridge-packages
          path: dist
      - name: Publish individual ZIP and XPI files
        run: bash scripts/publish-release.sh
        env:
          GH_TOKEN: ${{ github.token }}
