name: Browser Bridge CI
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:chrome
      - run: npm run build:firefox
      - run: npm run build:firefox:android
      - name: Package and validate all extension targets
        run: bash scripts/package-extensions.sh
        env:
          CHROME_EXTENSION_PRIVATE_KEY: ${{ secrets.CHROME_EXTENSION_PRIVATE_KEY }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      - uses: actions/upload-artifact@v6
        with:
          name: browser-bridge-packages
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
  protocol-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          path: browser-bridge
      - uses: actions/checkout@v5
        with:
          repository: jue-wq/VortexDM
          path: VortexDM
      - run: diff -u VortexDM/docs/IPC_PROTOCOL.md browser-bridge/docs/IPC_PROTOCOL.md
  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: [verify, protocol-sync]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: browser-bridge-packages
          path: release-assets
      - name: Publish individual extension files
        run: bash scripts/publish-release.sh
        env:
          GH_TOKEN: ${{ github.token }}
